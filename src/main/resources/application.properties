spring.application.name=medisalud-citas

spring.datasource.url=jdbc:h2:mem:medisalud;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

server.error.include-stacktrace=never
server.error.include-message=never

app.clock.zone=America/Bogota
app.seed.enabled=true

app.penalties.max=${APP_PENALTIES_MAX:3}
app.penalties.window-days=${APP_PENALTIES_WINDOW_DAYS:30}

springdoc.swagger-ui.path=/swagger-ui.html
